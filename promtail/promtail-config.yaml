server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: project-management-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          service: project-management
          __path__: /var/log/project-management/*.log

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: reverse-proxy
          __path__: /var/log/nginx-logs/*.log
